[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-vision-repro"
version = "0.1.0"
description = "Industrial vision project scaffold for machine vision experiments and deployment."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Industrial Vision Team" }
]
dependencies = [
  "numpy>=1.23",
  "opencv-python>=4.8",
  "torch>=2.0",
  "torchvision>=0.15",
  "matplotlib>=3.7",
  "scikit-learn>=1.2",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "Pillow>=10.0",
  "tqdm>=4.64",
  "pytest>=7.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]