[metadata]
name = industrial-vision-repro
version = 0.1.0
description = Industrial vision project scaffold for image-based industrial applications.
url = https://github.com/hyphen168/Yolov5m-NEU-DET
license = MIT

[options]
package_dir =
    = src
packages = find:
install_requires =
    numpy>=1.23
    opencv-python>=4.8
    torch>=2.0
    torchvision>=0.15
    matplotlib>=3.7
    pandas>=2.0
    scikit-learn>=1.2
    PyYAML>=6.0
    Pillow>=10.0
    tqdm>=4.64
    pytest>=7.0

[options.packages.find]
where = src

[tool:pytest]
testpaths = tests
python_files = test_*.py
pythonpath = . src
