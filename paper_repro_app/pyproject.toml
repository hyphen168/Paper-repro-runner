[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-repro-runner"
version = "2.3.0"
description = "Lightweight paper reproduction automation app with local control and remote cloud execution."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Copilot" }]
dependencies = [
  "streamlit==1.62.0",
  "pandas==3.0.5",
  "numpy==2.5.2",
  "requests==2.34.2",
  "beautifulsoup4==4.15.0",
  "PyYAML==6.0.3",
  "paramiko==5.0.0",
  "pydantic==2.13.5"
]

[project.scripts]
paper-repro-runner = "paper_repro_app.__main__:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 160
target-version = "py310"
exclude = ["paper_repro_app/_url_ds_helper.py", "paper_repro_app/_split_helper.py", ".venv"]
lint.ignore = ["E501", "E701", "E731", "B007", "B905", "B904"]

[tool.ruff.lint.per-file-ignores]
"paper_repro_app/_url_ds_helper.py" = ["E", "F", "B"]
"paper_repro_app/_split_helper.py" = ["E", "F", "B"]
"paper_repro_app/__main__.py" = ["E402"]
"tests/*.py" = ["E402", "E501", "E701"]
